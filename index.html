<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login Demo</title>
	
</head>

<body>
<div id = "loginPage" style = "display: block;">
<h2>Login with Google</h2>

<button id="loginBtn">
  Login with Google
</button>
</div>
<div id="status"></div>
<div class="mb-4" id = "welcome" style = "display: none;">
                <label for="userName" class="block text-gray-700 font-bold mb-2">ยินดีต้อนรับคุณ:</label>
                <input type="text" id="userName" name="userName" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" readonly>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD9I15QhqPsl-8ybMyrFaGcP4u1HkdcKF4",
  authDomain: "member-nuadthai.firebaseapp.com",
  projectId: "member-nuadthai",
  appId: "1:1009776261711:web:28ff1ea8ae86ed50e9483a"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();



document
.getElementById("loginBtn")
.addEventListener("click", async () => {

  try {

    const result =
      await signInWithPopup(
        auth,
        provider
      );

    const user = result.user;

    const name = user.displayName;
	const email = user.email;
	const uid = user.uid;
     
     var url = 'https://script.google.com/macros/s/AKfycbyR_rGviIX53e2f59qstKaJUSBl-EjkSgraI1bZF8AlQgmcPJ8yLVxLFCTJ7D8bjRm7Cw/exec?name=' + encodeURIComponent(name)+ '&email=' + encodeURIComponent(email)+ '&uid=' + encodeURIComponent(uid);
            
     fetch(url)
        .then(response => response.json())
        .then(data => {
            console.log('Success:', data);
            document.getElementById('status').innerHTML = "บันทึกข้อมูลสำเร็จ";
			document.getElementById('userName').value = name;
			document.getElementById("welcome").style.display = "block";
			document.getElementById("loginPage").style.display = "none";
        })
        .catch((error) => {
            console.error('Error:', error);
            document.getElementById('status').innerHTML = "เกิดข้อผิดพลาดในการบันทึกข้อมูล";
        });

    // ทดสอบเรียก GAS โดยเปิด URL ตรง
    // window.location.href = "https://www.youtube.com/";

  }
  catch(error) {

    console.error(error);

    alert(
      "Error : " +
      error.message
    );

  }

});

</script>

</body>
</html>
